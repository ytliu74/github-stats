name: Generate Stats Images

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'generated/**'
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Test
      run: |
        zig build test

    - name: Verify token email access
      run: gh api user/emails --silent
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Generate images
      run: |
        mkdir -p generated
        ./zig-out/bin/github-stats \
          --overview-output-file generated/overview.svg \
          --languages-output-file generated/languages.svg
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS || secrets.EXCLUDED }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS || secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: "true"
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Validate generated images
      run: |
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        for path in ['generated/overview.svg', 'generated/languages.svg']:
            root = ET.parse(path).getroot()
            assert root.tag == '{http://www.w3.org/2000/svg}svg', path
        PY

    - name: Commit to the repo
      if: github.ref == 'refs/heads/master'
      run: |
        git config user.name "jstrieb/github-stats"
        git config user.email "github-stats[bot]@jstrieb.github.io"
        git add generated/overview.svg generated/languages.svg
        if ! git diff --cached --quiet; then
          git commit -m 'Update generated files'
          git push origin HEAD:master
        fi
